name: Automated Deals Aggregator & Publisher

on:
  push:
    branches:
      - main
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) at zero cost
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Feed Aggregator
        run: |
          python aggregator.py

      - name: Build Static Catalog
        run: |
          python build.py

      - name: Commit Fresh Data Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update deals catalog [skip ci]" && git push)

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
